{% extends "base.html" %}{% block title %}Admin login{% endblock %}{% block body %}
<section class="card narrow"><h1>Admin login</h1>
<p class="muted">Use the GATEWAY_ADMIN_TOKEN from your private .env file. There is no default password.</p>
{% if error %}<p class="alert">{{ error }}</p>{% endif %}
<form method="post"><label>Admin token<input type="password" name="token" autocomplete="current-password" required></label>
<button class="btn" type="submit">Log in</button></form></section>
{% endblock %}
