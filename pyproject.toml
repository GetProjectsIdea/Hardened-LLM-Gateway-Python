[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hardened-llm-gateway"
version = "1.0.0"
description = "Hardened self-hosted LLM gateway for Ollama / LiteLLM / Open WebUI: per-user hashed API keys, no default keys, weak-secret refusal, rate limits, JSONL audit logs and a config auditor."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Pardeep Patel" }]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
web = ["Flask>=3.0"]
dev = ["pytest>=8.0", "Flask>=3.0"]

[project.scripts]
llm-gateway = "llm_gateway.cli:main"

[project.urls]
Homepage = "https://getprojects.org/hardened-llm-gateway-python/"
Source = "https://github.com/GetProjectsIdea/Hardened-LLM-Gateway-Python"

[tool.setuptools]
packages = ["llm_gateway"]

[tool.setuptools.package-data]
llm_gateway = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["examples", ".venv"]
